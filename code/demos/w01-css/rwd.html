<!DOCTYPE html>
<html>
<head>
	<title>RWD</title>
	<!-- 【說明】這個範例示範 Bootstrap 5 的響應式格線（RWD）。
	     縮放瀏覽器寬度，觀察三個方塊在不同寬度下的排列方式。 -->
	<meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
	<!-- 【說明】從 CDN 引入 Bootstrap 的 CSS。integrity 是檔案的雜湊值，用來確認下載的檔案沒有被竄改。 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
  <!-- 【說明】Bootstrap 的 JS（下拉選單、彈出視窗等元件需要它；只用格線的話可以不載入）。 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
  <style type="text/css">
		/* 【說明】給三種欄位 class 加上灰底和邊框，方便看出每一欄的範圍。 */
		.col-lg-4, .col-md-6, .col-sm-12{
			background: #eee;
			border: 1px solid #333;
		}
	</style>
</head>
<body>
	<!-- 【說明】格線結構固定是：.container（容器）→ .row（列）→ .col-*（欄）。 -->
	<div class="container">
		<h1>Test</h1>
		<div class="row">
			<!-- 【說明】一列分成 12 等分：
			     col-lg-4：大螢幕（≥992px）佔 4/12 → 三個並排
			     col-md-6：中螢幕（≥768px）佔 6/12 → 兩個一列
			     col-sm-12：小螢幕（≥576px）佔 12/12 → 一個一列 -->
			<div class="col-lg-4 col-md-6 col-sm-12">1</div>
			<div class="col-lg-4 col-md-6 col-sm-12">2</div>
			<div class="col-lg-4 col-md-6 col-sm-12">3</div>
		</div>
	</div>
</body>
</html>
