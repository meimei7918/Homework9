; 【說明】PHP 設定檔（會被 Dockerfile 複製到 /usr/local/etc/php/conf.d/）。
;   short_open_tag=On：允許省略開頭標籤裡的 php 三個字（短標籤）。src/first.php 第一段就是用短標籤，關掉這個設定的話那段不會被執行，會原樣送到瀏覽器。
short_open_tag=On
; 【說明】display_errors=On：錯誤訊息直接顯示在輸出裡，開發時方便除錯；正式網站應該關掉，避免洩漏路徑等資訊。
display_errors=On
; 【說明】error_reporting：要回報哪些錯誤。E_ALL 是全部，& ~E_NOTICE 表示「但不要 notice」，以此類推。
;   所以未定義變數這類較輕微的訊息仍會出現（PHP 8 起它屬於 Warning，不是 Notice）。
error_reporting=E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED


