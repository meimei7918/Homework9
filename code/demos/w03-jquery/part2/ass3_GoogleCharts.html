<html>
  <head>
    <!-- 【說明】這個範例用 Google Charts 畫圓餅圖（原檔名為「ass3_Google Charts.html」）。
         loader.js 是 Google Charts 的載入器，實際的圖表程式碼由它再去下載。 -->
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      // Load the Visualization API and the corechart package.
      // 【說明】載入 corechart 套件（包含圓餅圖、長條圖、折線圖等常用圖表）。
      google.charts.load('current', {'packages':['corechart']});
      
      // Set a callback to run when the Google Visualization API is loaded.
      // 【說明】套件是非同步載入的，所以要用 setOnLoadCallback 指定「載入完成後」才執行 drawChart。
      google.charts.setOnLoadCallback(drawChart);
      // Callback that creates and populates a data table,
      // instantiates the pie chart, passes in the data and
      // draws it.
      function drawChart() {
        // Create the data table.
        // 【說明】DataTable 是 Google Charts 的資料格式：先定義欄位，再加入資料列。
        var data = new google.visualization.DataTable();
        // 【說明】addColumn(型別, 名稱)：第一欄是字串（品牌），第二欄是數字（百分比）。
        data.addColumn('string', 'brand');
        data.addColumn('number', 'percentage');
        // 【說明】addRows：一次加入多列，每列是一個陣列，順序對應上面的欄位。
        data.addRows([     //amount
          ['Chrome', 60],
          ['Internet Explorer', 10],
          ['Firefox', 5],
          ['Edge', 9],
          ['Safari', 12],
          ['Other', 4]
        ]);
        
        // Set chart options
        // 【說明】options：標題與圖表大小（像素）。
        var options = {'title':'Browser market shares in January, 2018',
                       'width':400,
                       'height':300};
        // Instantiate and draw our chart, passing in some options.
        // 【說明】建立圓餅圖物件並指定要畫在哪個 div，再用 draw(資料, 選項) 畫出來。
        var chart = new google.visualization.PieChart(document.getElementById('chart_div'));
        chart.draw(data, options);
      }
    </script>
  </head>
  <body>    
    <div id="chart_div"></div>
  </body>
</html>
