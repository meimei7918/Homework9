<!DOCTYPE html>
<html>
  <head>  
    <title>jQuery Example</title>
    <!-- 【說明】這是 ass3_settimeout2.html 的修正版（原檔名為「ass3_settimeout2 - 複製.html」）。
         修正了兩個問題：連按 b3 會重複開計時器、第二個計時器停不掉。 -->
    <!--include jQuery-->
    <!-- 【說明】引入 jQuery 3.4.1（CDN 壓縮版）。 -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"    
        integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo=" crossorigin="anonymous">
    </script> <!--Way 2-->    
  </head>
  <body>
    <script> <!--put your JavaScript here-->       
      $(function(){                    //$(document).ready(function(){ });        
        $("#b1").click(function(){
          $("#para1").animate({        //params
              left:'250px',
              height:'300px',
              width:'300px'
          },10000,
             function(){
              setTimeout(function(){ 
                $("#para1").animate({        //params
                    left:'0px',
                },1000); 
              }, 2000);  //waiting for 5 secs
            }
          );   
        });
        $("#b2").click(function(){
            $("#para1").stop();
        });
        
        function tTimer() {
            // 【說明】console.log 用來確認 tTimer 被呼叫了幾次，打開 Console 觀察。
            console.log('33333');
            var d = new Date();
            var h=d.getHours();
            var m=d.getMinutes();
            var s=d.getSeconds();
            var timeString=h+":"+m+":"+s;
            $("#para1").text(timeString);
        }
        var setIntent;
        // 【說明】多宣告一個變數 a，用來存第二個計時器的編號。
        var a;
        $("#b3").click(function(){
            // 【說明】開新計時器之前先 clearInterval 清掉舊的，連按 b3 也只會有一個計時器在跑。
            clearInterval(setIntent);
            setIntent=setInterval(tTimer, 1000);
        });
        $("#b4").click(function(){
            // 【說明】b4 把兩個計時器都停掉。
            clearTimeout(setIntent);
            clearTimeout(a);
        });
        $("#b3").click(function(){
            // 【說明】第二個計時器同樣先清掉舊的，並把編號存進 a。
            clearInterval(a);
            a=setInterval(function() {
            var d = new Date();
            var h=d.getHours();
            var m=d.getMinutes();
            var s=d.getSeconds();
            var timeString=h+":"+m+":"+s;
            $("#para1").text(timeString);
          }, 3000);
        });/**/
        
      });
    </script>
    <button id="b1">press me</button>    
    <div id="para1" style="background:#ffbf21;height:50px;width:50px;position:absolute;">para1</div>    
    <button id="b2" >press me to stop animation</button>
    <button id="b3" >press me for testing setInterval</button>
    <button id="b4" >press me to stop setInterval</button> 
  </body>
</html>
