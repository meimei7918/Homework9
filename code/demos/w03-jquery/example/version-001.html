<!DOCTYPE html>
<html lang='zh-TW'>
  <head>
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8'>
    <!-- 【說明】【v1】這是「記帳」小專案，共四個版本，每一版多加一點功能（變更紀錄見 readme.md）。
         使用 Bootstrap 4 做版面與對話框（modal）。Bootstrap 4 的 JS 需要 jQuery 與 Popper.js，所以要依序載入下面三個 script。
         這裡載入的是 jQuery「slim」版：去掉了 AJAX 和特效，檔案較小，本專案用不到那些功能。
         v1 只做好畫面：標題、新增按鈕、表格、對話框；按新增會開啟對話框，按 Save 關閉。 -->
    <link rel='stylesheet' href='https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css' integrity='sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO' crossorigin='anonymous'>
    <script src='https://code.jquery.com/jquery-3.3.1.slim.min.js' integrity='sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo' crossorigin='anonymous'></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js' integrity='sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49' crossorigin='anonymous'></script>
    <script src='https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js' integrity='sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy' crossorigin='anonymous'></script>
    <style>
      .row{
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class='container'>
      <!------------------------------------------------------>
      <div class='row'>
        <h1>記帳</h1>
      </div>
      <!------------------------------------------------------>
      <div class='row'>
        <!-- 【說明】float-right：Bootstrap 4 的 class，讓按鈕靠右。btn-info 決定按鈕顏色。 -->
        <div class='col-12'><button class='btn btn-info float-right' id='addBtn'>新增</button></div>
      </div>
      <!------------------------------------------------------>
      <div class='row'>
        <!-- 【說明】表格先只有表頭；之後的版本會用 jQuery 動態新增資料列。 -->
        <table class='table' id='table1'>
          <tr><th>時間</th><th>金額</th><th>備註</th></tr>
        </table>
      </div>
      <!------------------------------------------------------>
      <!-- 【說明】Bootstrap 的對話框（modal）。平常是隱藏的，用 $('#dialog1').modal('show') 叫出來。
           data-dismiss='modal' 的按鈕（右上角 ×、Cancel）不用寫程式就能關閉對話框。 -->
      <div class='modal fade' id='dialog1' tabindex='-1' role='dialog' aria-labelledby='dialog1-title' aria-hidden='true'>
        <div class='modal-dialog modal-dialog-centered' role='document'>
          <div class='modal-content'>
            <div class='modal-header'>
              <h2 class='modal-title' id='dialog1-title'>記帳-新增</h2>   <!---modify-->
              <button type='button' class='close' data-dismiss='modal' aria-label='Close'>
                <span aria-hidden='true'>&times;</span>
              </button>
            </div>
            <div class='modal-body'>
              <!-- 【說明】老師標註 modify：對話框裡的表單之後要調整，例如每個 label 的 for 應該對應 input 的 id。 -->
              <form>                <!---modify-->
                <div class='form-group row'>
                  <label for='staticEmail' class='col-sm-2 col-form-label'>時間</label>
                  <div class='col-sm-10'>
                    <input type='text' class='form-control' id='time' />
                  </div>
                </div>
                <div class='form-group row'>
                  <label for='inputPassword' class='col-sm-2 col-form-label'>金額</label>
                  <div class='col-sm-10'>
                    <input type='text' class='form-control' id='cost' />
                  </div>
                </div>
                <div class='form-group row'>
                  <label for='inputPassword' class='col-sm-2 col-form-label'>備註</label>
                  <div class='col-sm-10'>
                    <textarea class='form-control' id='note' rows='5'></textarea>
                  </div>
                </div>
              </form>
            </div>
            <div class='modal-footer'>
              <button type='button' class='btn btn-secondary' data-dismiss='modal'>Cancel</button>
              <button type='button' class='btn btn-primary' id='saveBtn'>Save</button>
            </div>
          </div>
        </div>
      </div>
      <!------------------------------------------------------>
      <script>
        $(function(){          
          // 【說明】按「新增」→ 用 Bootstrap 提供的 jQuery 方法 modal('show') 開啟對話框。
          $('#addBtn').click(function(){
            $('#dialog1').modal('show');
          });
          // 【說明】按「Save」→ modal('hide') 關閉對話框。v1 還沒有存資料。
          $('#saveBtn').click(function(){
            //hide dialog
            $('#dialog1').modal('hide');
          });
        });
      </script>
    </div>
  </body>
</html>
