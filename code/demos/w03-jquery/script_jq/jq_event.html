<!DOCTYPE html>
<html>
  <head>
    <title>jQuery Example</title>
    <!--include jQuery-->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
      integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
      crossorigin="anonymous">
    </script>     
  </head>
  <body>
    <script>        
      $(function(){                        //$(document).ready(function(){ });
        $("#block1").click(function(){
            $("#block1").css("color","red").css("background-color","black");
        });
        $("#block2").dblclick(function(){
            $("#block2").css("color","green");
        });
        $("#block3").mouseenter(function(){
            alert("You entered block3!");
        });
        $("#block4").hover(function(){        //combination of the mouseenter() and mouseleave() event
            alert("You entered block4!");
        },
        function(){
            alert("Oh! You now leave block4!");
        }); 
      });
    </script>
    <div id="block1">blockArea1</div>
    <div id="block2">blockArea2</div>
    <div id="block3">blockArea3</div>
    <div id="block4">blockArea4</div>
  </body>
</html>
