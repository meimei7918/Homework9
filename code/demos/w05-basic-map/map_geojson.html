<!doctype html>
<html lang="zh-TW">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8'>
    <!--jQuery-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
       
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
      
    <!--Openlayers-->
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.2.1/dist/ol.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.2.1/ol.css">  
    <!-- 【說明】這個範例示範讀入 GeoJSON（捷運站點），用紅色圖釘顯示在底圖上。 -->
    <style>
      html,body{
        margin: 0px;
        padding: 0px;
        height:100%;
        width: 100%;
      }
      #map {
        height:100% !important;
        width: 100%;
        border:1px;
      }
    </style>
    <title>OpenLayers map demo</title>
  </head>
  <body>
    <div id='map'></div>
    <div class='controle-plane'>
      <select id='layer'>
        <option value='0'>Google map</option>
        <option value='1' selected>OpenStreeMap</option>
        <option value='2'>臺灣通用電子地圖</option>
        <option value='3'>正射影像</option>
      </select>
    </div>
    <script>
      var init_lat=23.62;
      var init_lng=120.5;
      
      // 【說明】WMTS 圖磚格網設定（國土測繪中心的底圖要用）：
      //   projection：EPSG:3857（Web Mercator），網路地圖的標準投影。
      //   projectionExtent：EPSG:3857 的世界範圍，約 ±20037508 公尺。
      //   size：第 0 層的解析度＝世界寬度 ÷ 256 像素 ≈ 156543 公尺／像素。
      //setting for tile services
      var projection = ol.proj.get('EPSG:3857');              //projection
      var projectionExtent = projection.getExtent();          //projectionExtent
      var size = ol.extent.getWidth(projectionExtent) / 256;  //size
      var resolutions = new Array(20);                        //resolutions
      var matrixIds = new Array(20);                          //matrixIds
      // 【說明】依序算出第 0～19 層的解析度：每放大一層，每個像素代表的距離減半（÷ 2^z）。
      //   matrixIds 是每一層的編號，WMTS 用它組出圖磚網址。
      for (var z = 0; z < 20; ++z) {   
          resolutions[z] = size / Math.pow(2, z);
          matrixIds[z] = z;
      }
      // 【說明】baseLayers：四個底圖，對應下拉選單。
      var baseLayers=[                //Basemaps
        new ol.layer.Tile({           //Google
          visible:false,
          source: new ol.source.XYZ({
            crossOrigin: 'anonymous',
            url: 'https://mt{0-3}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
          })
        }),
        new ol.layer.Tile({          //OpenStreeMap
          visible:false,
          source: new ol.source.XYZ({
            crossOrigin: 'anonymous',
            url: 'https://{a-c}.tile.openstreetmap.org/{z}/{x}/{y}.png'
          })
        }),
        new ol.layer.Tile({        //臺灣通用電子地圖
          visible:false,
          extent: projectionExtent,
          source: new ol.source.WMTS({
              // [網站版修改] 原為 http://，改成 https，否則 HTTPS 網站會擋下圖磚
              url: 'https://maps.nlsc.gov.tw/S_Maps/wmts?',
              layer: 'EMAP',
              matrixSet: 'GoogleMapsCompatible',
              format: 'image/jpeg',
              projection: projection,
              tileGrid: new ol.tilegrid.WMTS({
                  origin: ol.extent.getTopLeft(projectionExtent),
                  resolutions: resolutions,
                  matrixIds: matrixIds
              }),
              extent: projectionExtent,
              style: 'default'
          })
        })
        ,
        new ol.layer.Tile({          //正射影像
          visible:false,
          extent: projectionExtent,
          source: new ol.source.WMTS({
            // [網站版修改] 原為 http://，改成 https，否則 HTTPS 網站會擋下圖磚
            url: 'https://wmts.nlsc.gov.tw/wmts?',
            layer: 'PHOTO2',
            matrixSet: 'GoogleMapsCompatible',
            format: 'image/jpeg',
            projection: projection,
            tileGrid: new ol.tilegrid.WMTS({
              origin: ol.extent.getTopLeft(projectionExtent),
              resolutions:resolutions,
              matrixIds:matrixIds,
            }),
            extent: projectionExtent,
            style: 'default'
          })
        }),
      ];
      // 【說明】setLayer：切換底圖。所有底圖都已加進地圖，只把第 idx 個設為可見、其他隱藏。
      //   for…in 走訪陣列時 i 是字串 "0"、"1"…，下拉選單的值也是字串，所以 idx==i 能正確比對。（i 沒有宣告，會變成全域變數）
      var setLayer=function(idx){
        for(var i in baseLayers)
          baseLayers[i].setVisible(idx==i);
      }
      // 【說明】loadGeoJSON(url)：讀入一個 GeoJSON 檔並加成一個向量圖層。
      var loadGeoJSON=function(url){            //function loadGeoJSON(url){};
        console.log(url);
        // 【說明】ol.layer.Vector：向量圖層（點、線、面）。geojson 沒有用 var 宣告，會變成全域變數。
        geojson = new ol.layer.Vector({
          // 【說明】ol.source.Vector：向量資料來源。給 url 與 format，OpenLayers 會自動下載並解析。
          //   GeoJSON 預設是 EPSG:4326，OpenLayers 會自動轉成地圖的 EPSG:3857。
          source: new ol.source.Vector({
            url: url,                     
            format: new ol.format.GeoJSON()
          }),
          // 【說明】style：圖層樣式。這裡用 ol.style.Icon 以圖片當作點的符號。
          style: [
            new ol.style.Style({
              image: new ol.style.Icon({
                // 【說明】anchor：圖片的哪一點對準座標。圖釘圖片是 32×32，[16, 32] 是「底部正中央」，針尖才會剛好指在站點上。
                anchor: [16,32],        //image size=32*32, Default value is the icon center.
                anchorXUnits: 'pixels',
                anchorYUnits: 'pixels',
                crossOrigin: 'anonymous',
                src: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png',
              })
            }),
          ],/**/
        });
        // 【說明】map.addLayer：把向量圖層加到地圖上（加在所有底圖之上）。
        map.addLayer(geojson);
      }
      var map = new ol.Map({            //create a OpenLayers Map object  
        target: 'map',
        layers:baseLayers,
        view: new ol.View({
          // 【說明】地圖中心：經緯度（EPSG:4326）要轉成地圖的 EPSG:3857 才能使用。注意順序是 [經度, 緯度]。
          center: ol.proj.transform([init_lng,init_lat],'EPSG:4326','EPSG:3857'),
          zoom: 8
        })
      });
      $(function(){
        // 【說明】老師保留的幾種嘗試：直接讀別的網域的檔案會被瀏覽器的同源政策（CORS）擋下。
        //   解法是把檔案放在自己的網站，或透過自己網站上的 proxy.php 轉送。網站版直接讀同資料夾的 metro.geojson。
        //loadGeoJSON('https://sgis.tw/WebGIS/data/metro.geojson');  // it does not work when cross-domain!! 
        //url=encodeURIComponent('http://localhost/webgis/framework/data/metro.geojson'); // this does not work!!        
        //console.log(url);
                
        //var url=encodeURIComponent('https://sgis.tw/WebGIS/data/metro.geojson');
        //loadGeoJSON('https://sgis.tw/WebGIS/data/proxy.php?url='+url);/**/
        loadGeoJSON('metro.geojson'); // [網站版修改] 原為 http://localhost/webgis/framework/data/metro.geojson/**/
        setLayer(1);
        $('#layer').change(function(){
          setLayer($(this).val());
        });
      });
    </script>
  </body>
</html>
