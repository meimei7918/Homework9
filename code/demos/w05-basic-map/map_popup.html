<!doctype html>
<html lang="zh-TW">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8'>
    <!--jQuery-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
       
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
      
    <!--Openlayers-->
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.2.1/dist/ol.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.2.1/ol.css"> 
    <!-- 【說明】這個範例示範點擊捷運站時，彈出一個小表格顯示站名、經緯度、類型。 -->
    <style>
      html,body{
        margin: 0px;
        padding: 0px;
        height:100%;
      }
      #map {
        height: 600px;
        width: 100%;
      }
      /* 【說明】.info：彈出視窗的樣式（白底、紅框）；下面幾條調整裡面表格的間距與表頭顏色。 */
      .info{
        background: #FFF;
        color: #000;
        border: 1px solid #f00;
      }
      .info > .table{
        margin-bottom:0;
      }
      .info > .table th, .info > .table td{
        padding: 4px;
        line-height: 1.2;
      }
      .info > .table > thead > tr{
        background: #d9edf7;
      }
      .info > .table > tbody > tr:nth-child(odd){
        background: #dff0d8;
      }
      .info > .table > tbody > tr:nth-child(even){
        background: #fcf8e3;
      }
    </style>
    <title>OpenLayers map demo</title>
  </head>
  <body>
    <div class='frame_div'>
      <div class='container-fluid' id='main_container'>
        <div class='row'>
          <div class='col-xs-12 col-md-12'>
            <div id='map_div'>
              <div class='controle-plane'>
                <select id='layer'>
                  <option value='0'>Google map</option>
                  <option value='1' selected>OpenStreeMap</option>
                  <option value='2'>通用版電子地圖</option>
                  <option value='3'>正射影像</option>
                </select>
              </div>
              <div id="map"></div>
              <script>
                let init_lat=23.62;
                let init_lng=120.5;
                //setting for tile services
                let projection = ol.proj.get('EPSG:3857');              //projection
                let projectionExtent = projection.getExtent();          //projectionExtent
                let size = ol.extent.getWidth(projectionExtent) / 256;  //size
                let resolutions = new Array(23);                        //resolutions
                let matrixIds = new Array(23);                          //matrixIds
                for (let z = 0; z < 23; ++z) {   
                    resolutions[z] = size / Math.pow(2, z);
                    matrixIds[z] = z;
                }
                // 【說明】baseLayers：四個底圖，對應下拉選單。
                let baseLayers=[                //Basemaps
                  new ol.layer.Tile({           //Google
                    visible:false,
                    source: new ol.source.XYZ({
                      crossOrigin: 'anonymous',
                      url: 'https://mt{0-3}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
                    })
                  }),
                  new ol.layer.Tile({          //OpenStreeMap
                    visible:false,
                    source: new ol.source.XYZ({
                      crossOrigin: 'anonymous',
                      url: 'https://{a-c}.tile.openstreetmap.org/{z}/{x}/{y}.png'
                    })
                  }),
                  new ol.layer.Tile({        //臺灣通用電子地圖
                    visible:false,
                    extent: projectionExtent,
                    source: new ol.source.WMTS({
                        // [網站版修改] 原為 http://，改成 https，否則 HTTPS 網站會擋下圖磚
                        url: 'https://maps.nlsc.gov.tw/S_Maps/wmts?',
                        layer: 'EMAP',
                        matrixSet: 'GoogleMapsCompatible',
                        format: 'image/jpeg',
                        projection: projection,
                        tileGrid: new ol.tilegrid.WMTS({
                            origin: ol.extent.getTopLeft(projectionExtent),
                            resolutions: resolutions,
                            matrixIds: matrixIds
                        }),
                        extent: projectionExtent,
                        style: 'default'
                    })
                  })
                  ,
                  new ol.layer.Tile({          //正射影像
                    visible:false,
                    extent: projectionExtent,
                    source: new ol.source.WMTS({
                      // [網站版修改] 原為 http://，改成 https，否則 HTTPS 網站會擋下圖磚
                      url: 'https://wmts.nlsc.gov.tw/wmts?',
                      layer: 'PHOTO2',
                      matrixSet: 'GoogleMapsCompatible',
                      format: 'image/jpeg',
                      projection: projection,
                      tileGrid: new ol.tilegrid.WMTS({
                        origin: ol.extent.getTopLeft(projectionExtent),
                        resolutions:resolutions,
                        matrixIds:matrixIds,
                      }),
                      extent: projectionExtent,
                      style: 'default'
                    })
                  })
                ];

                // 【說明】建立地圖物件（底圖、View）。
                let map = new ol.Map({            //create a OpenLayers Map object  
                  target: 'map',         
                  layers: baseLayers,
                  view: new ol.View({
                    center: ol.proj.transform([init_lng,init_lat],'EPSG:4326','EPSG:3857'),
                    zoom: 8
                  })
                });

                // 【說明】setLayer：切換底圖。所有底圖都已加進地圖，只把第 idx 個設為可見、其他隱藏。
                //   for…in 走訪陣列時 i 是字串 "0"、"1"…，下拉選單的值也是字串，所以 idx==i 能正確比對。（i 沒有宣告，會變成全域變數）
                let setLayer=function(idx){
                  for(i in baseLayers)
                    baseLayers[i].setVisible(idx==i);
                }
                // 【說明】loadGeoJSON(url)：讀入 GeoJSON 並用紅色圖釘顯示，寫法同 map_geojson.html。
                let loadGeoJSON=function(url){      //function loadGeoJSON(url){};
                  geojson = new ol.layer.Vector({
                    source: new ol.source.Vector({
                      url: url,
                      format: new ol.format.GeoJSON()
                    }),
                    style: [
                      new ol.style.Style({
                        image: new ol.style.Icon(({
                          anchor: [16,32],
                          anchorXUnits: 'pixels',
                          anchorYUnits: 'pixels',
                          opacity: 1.00,
                          crossOrigin: 'anonymous',
                          src: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png',
                        }))
                      }),
                    ],/**/
                  });
                  map.addLayer(geojson);
                }

                // 【說明】popup 存目前顯示中的彈出視窗，下次點擊前先移除它。
                let popup=undefined;
                // 【說明】singleclick：單擊地圖時觸發（和 click 的差別是：雙擊放大時不會觸發）。evt 裡有點擊位置的資訊。
                map.on('singleclick', function(evt) {  //triger singleclick, get evt,
                  // 【說明】forEachFeatureAtPixel：找出點擊的螢幕像素位置上有哪些圖徵；回呼函式 return 第一個找到的 feature。沒點到東西就是 undefined。
                  let feature = map.forEachFeatureAtPixel(evt.pixel, function(feature, layer) {  //get feature and layer by evt.pixel
                    return feature;
                  });
                  // 【說明】注意：typeof 回傳的是字串，typeof(popup) != undefined 永遠成立。這裡等於每次都先移除舊的 popup（移除不存在的也不會出錯），效果正確，但更好的寫法是 if (popup) {...}。
                  if(typeof(popup)!=undefined){
                    map.removeOverlay(popup);
                  }
                  if (feature) {
                    // 【說明】feature.get('欄位名')：取得 GeoJSON properties 裡的屬性。有 name 才顯示（排除沒有名稱的圖徵）。
                    if(feature.get('name')!=undefined){
                      // 【說明】ol.Overlay：把一個 HTML 元素「釘」在地圖座標上，地圖移動時會跟著動。
                      //   element 用 jQuery 動態組出一個 div＞table：表頭一列（key / value），內容四列（名稱、lat、lng、type）。
                      popup = new ol.Overlay({
                        element: $("<div />").addClass('info').append(   //put a table to element parameter
                          $("<table />").addClass('table').append(
                            $("<thead />").append(
                              $("<tr />").append(
                                $("<th />").html("key")
                              ).append(
                                $("<th />").html("value")
                              )
                            )
                          ).append(
                            $("<tbody />").append(
                              $("<tr />").append(
                                $("<td />").html("名稱")
                              ).append(
                                $("<td />").html(feature.get('name'))
                              )
                            ).append(
                              $("<tr />").append(
                                $("<td />").html("lat")
                              ).append(
                                $("<td />").html(feature.get('lat'))
                              )
                            ).append(
                              $("<tr />").append(
                                $("<td />").html("lng")
                              ).append(
                                $("<td />").html(feature.get('lng'))
                              )
                            ).append(
                              $("<tr />").append(
                                $("<td />").html("type")
                              ).append(
                                $("<td />").html(feature.get('stype'))
                              )
                            )
                          )
                        // 【說明】[0]：從 jQuery 物件取出原生的 DOM 元素，因為 ol.Overlay 的 element 需要原生元素。
                        )[0]
                      });
                      // 【說明】把彈出視窗放在點擊的位置（evt.coordinate 是地圖座標 EPSG:3857），再加到地圖上。
                      popup.setPosition(evt.coordinate);
                      map.addOverlay(popup);
                    }
                  }
                });
                // 【說明】等 DOM 建好：先顯示第 1 個底圖（OSM），再監聽下拉選單，選項改變就切換底圖。
                $(function(){
                  let url=encodeURIComponent('https://sgis.tw/WebGIS/data/metro.geojson');
                  loadGeoJSON('metro.geojson'); // [網站版修改] 原為 sgis.tw 的 proxy.php，改讀同資料夾的 metro.geojson
				          setLayer(1);
                  $('#layer').change(function(i){
                    setLayer($(this).val());
                  });
                });
              </script>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
