<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <!-- 【說明】這是最小的 OpenLayers 地圖：一個 OSM 底圖＋一個 View。
         引入 OpenLayers：ol.js（程式）與 ol.css（控制項等樣式）。這是不需要編譯的完整版，所有功能都掛在全域變數 ol 底下。 -->
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.11.0/dist/ol.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.11.0/ol.css">
    <style>
      /* 【說明】讓 html、body、地圖都填滿整個視窗。地圖的 div 一定要有高度，否則是 0，什麼都看不到。 */
      html,body{ 
        margin: 0px;
        padding: 0px;
        height:100%;
      }
      #map {
        margin: 0px;
        padding: 0px;
        height: 100%;
        width: 100%;        
      }      
    </style>
    <title>OpenLayers map demo</title>
  </head>
  <body> 
    <!-- 【說明】地圖容器：OpenLayers 會把地圖畫在這個 div 裡。 -->
    <div id="map" class="map"></div>
    <script type="text/javascript">
      // 【說明】new ol.Map({...})：建立地圖物件。
      let map = new ol.Map({            //create a OpenLayers Map object  
        // 【說明】target：要掛到哪個 div（填 id）。
        target: 'map',         
        // 【說明】layers：圖層陣列。ol.layer.Tile 是圖磚圖層，資料來源 ol.source.OSM() 是 OpenStreetMap。
        layers: [
          new ol.layer.Tile({
            source: new ol.source.OSM()
          })
        ],
        // 【說明】view：觀看方式。地圖中心：經緯度（EPSG:4326）要轉成地圖的 EPSG:3857 才能使用。注意順序是 [經度, 緯度]。
        view: new ol.View({
          center: ol.proj.transform([121.751,23.8],'EPSG:4326','EPSG:3857'),
          // 【說明】zoom：縮放層級，數字越大越近。4 大約看得到東亞，老師註解提示可改成 8 看全臺灣。
          zoom: 4  //8
        })/**/
      });
    </script>   
  </body>
</html>
