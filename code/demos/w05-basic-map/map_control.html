<!doctype html>
<html lang="zh-TW">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8'>
    <!--jQuery-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
      
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
            
    <!--Openlayers-->
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.2.1/dist/ol.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.2.1/ol.css"> 
    
    <style>
      html,body{
        margin: 0px;
        padding: 0px;
        height:100%;
      }
      #map {
        //margin: 0px;
        //padding: 0px;
        height: 600px;
        width: 100%;        
      }
      
    </style>
    <title>OpenLayers map demo</title>
  </head>
  <body>
    <div class='frame_div'>
      <div class='container-fluid' id='main_container'>
        <div class='row'>
          <div class='col-xs-12 col-md-12'>
            <div id='map_div'>
              <div id="map"></div>
              <div class='controle-plane'>
                <select id='layer'>
                  <option value='0'>Google map</option>
                  <option value='1'>OpenStreeMap</option>
                  <option value='2'>臺灣通用電子地圖</option>
                  <option value='3'>正射影像</option>
                </select>
              </div>
              <script>
                let init_lat=23.62;
                let init_lng=120.5;
                
                //setting for tile services
                let projection = ol.proj.get('EPSG:3857');              //projection
                let projectionExtent = projection.getExtent();          //projectionExtent
                let size = ol.extent.getWidth(projectionExtent) / 256;  //size
                let resolutions = new Array(20);                        //resolutions
                let matrixIds = new Array(20);                          //matrixIds
                for (var z = 0; z < 20; ++z) {   
                    resolutions[z] = size / Math.pow(2, z);
                    matrixIds[z] = z;
                }
                
                let baseLayers=[                //Basemaps
                  new ol.layer.Tile({           //Google
                    visible:false,
                    source: new ol.source.XYZ({
                      crossOrigin: 'anonymous',
                      url: 'https://mt{0-3}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
                    })
                  }),
                  new ol.layer.Tile({          //OpenStreeMap
                    visible:false,
                    source: new ol.source.XYZ({
                      crossOrigin: 'anonymous',
                      url: 'https://{a-c}.tile.openstreetmap.org/{z}/{x}/{y}.png'
                    })
                  }),                  
                  new ol.layer.Tile({        //臺灣通用電子地圖
                    visible:false,
                    extent: projectionExtent,
                    source: new ol.source.WMTS({
                        url: 'https://maps.nlsc.gov.tw/S_Maps/wmts?',
                        layer: 'EMAP',
                        matrixSet: 'GoogleMapsCompatible',
                        format: 'image/jpeg',
                        projection: projection,
                        tileGrid: new ol.tilegrid.WMTS({
                            origin: ol.extent.getTopLeft(projectionExtent),
                            resolutions: resolutions,
                            matrixIds: matrixIds
                        }),
                        extent: projectionExtent,
                        style: 'default'
                    })
                  })
                  ,
                  new ol.layer.Tile({          //正射影像
                    visible:false,
                    extent: projectionExtent,
                    source: new ol.source.WMTS({
                      url: 'https://wmts.nlsc.gov.tw/wmts?',
                      layer: 'PHOTO2',
                      matrixSet: 'GoogleMapsCompatible',
                      format: 'image/jpeg',
                      projection: projection,
                      tileGrid: new ol.tilegrid.WMTS({
                        origin: ol.extent.getTopLeft(projectionExtent),
                        resolutions:resolutions,
                        matrixIds:matrixIds,
                      }),
                      extent: projectionExtent,
                      style: 'default'
                    })
                  })
                ];
                
                OverVeiwLayers=[                //Basemaps
                  new ol.layer.Tile({           //Google
                    source: new ol.source.XYZ({
                      crossOrigin: 'anonymous',
                      url: 'https://mt{0-3}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
                    })
                  }),
                  new ol.layer.Tile({          //OpenStreeMap
                    source: new ol.source.XYZ({
                      crossOrigin: 'anonymous',
                      url: 'https://{a-c}.tile.openstreetmap.org/{z}/{x}/{y}.png'
                    })
                  }),                  
                  new ol.layer.Tile({        //臺灣通用電子地圖
                    extent: projectionExtent,
                    source: new ol.source.WMTS({
                        url: 'https://maps.nlsc.gov.tw/S_Maps/wmts?',
                        layer: 'EMAP',
                        matrixSet: 'GoogleMapsCompatible',
                        format: 'image/jpeg',
                        projection: projection,
                        tileGrid: new ol.tilegrid.WMTS({
                            origin: ol.extent.getTopLeft(projectionExtent),
                            resolutions: resolutions,
                            matrixIds: matrixIds
                        }),
                        extent: projectionExtent,
                        style: 'default'
                    })
                  })
                  ,
                  new ol.layer.Tile({          //正射影像
                    extent: projectionExtent,
                    source: new ol.source.WMTS({
                      url: 'https://wmts.nlsc.gov.tw/wmts?',
                      layer: 'PHOTO2',
                      matrixSet: 'GoogleMapsCompatible',
                      format: 'image/jpeg',
                      projection: projection,
                      tileGrid: new ol.tilegrid.WMTS({
                        origin: ol.extent.getTopLeft(projectionExtent),
                        resolutions:resolutions,
                        matrixIds:matrixIds,
                      }),
                      extent: projectionExtent,
                      style: 'default'
                    })
                  })
                ];  ;
                let setLayer=function(idx){
                  for(i in baseLayers){
                    baseLayers[i].setVisible(idx==i);
                    OverVeiwLayers[i].setVisible(idx==i);
                  }
                }
                let mousePositionControl = new ol.control.MousePosition({
                    coordinateFormat: ol.coordinate.createStringXY(4),
                    projection: 'EPSG:4326',                    
                });/**/
                let my_controls=[
                  new ol.control.Zoom(),                  
                  //new ol.control.ZoomSlider(),
                  //new ol.control.ScaleLine(),
                  /*new ol.control.OverviewMap({
                    layers: OverVeiwLayers //[OverVeiwLayers[2]]
                  }),/**/
                  //new ol.control.MousePosition(),   //default, EPSG:3857
                  //mousePositionControl
                ];
                
                let map = new ol.Map({            //create a OpenLayers Map object  
                  target: 'map',
                  controls: my_controls,                  
                  layers:baseLayers,
                  view: new ol.View({
                    center: ol.proj.transform([init_lng,init_lat],'EPSG:4326','EPSG:3857'),
                    zoom: 8
                  })
                });
                $(function(){
                  setLayer(1);
                  $('#layer').change(function(i){
                    setLayer($(this).val());
                  });
                });
              </script>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
