<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <title>WebGIS 課程資料庫</title>
  <meta name="description" content="臺大地理系 WebGIS 課程的講義筆記、範例程式與課後練習，依週次整理。">
  <link rel="stylesheet" href="assets/css/style.css?v=20261116e">
  <script src="assets/js/site.js?v=20261116e" data-root="." defer></script>
</head>
<body class="home">
  <header class="home-head">
    <h1>WebGIS 課程資料庫</h1>
    <div class="controls">
      <input class="search" type="search" placeholder="搜尋，例如 OpenLayers、EPSG、jQuery" aria-label="搜尋內容">
      <div class="chips" role="group" aria-label="依類型篩選">
        <button class="chip" type="button" data-filter="all">全部</button>
        <button class="chip" type="button" data-filter="lecture" data-type="lecture">講義筆記</button>
        <button class="chip" type="button" data-filter="code" data-type="code">範例程式</button>
        <button class="chip" type="button" data-filter="practice" data-type="practice">課後練習</button>
        <button class="chip" type="button" data-filter="note" data-type="note">我的筆記</button>
      </div>
      <span class="active-tag"></span>
    </div>
  </header>
  <main id="line-map" class="catalog"></main>
</body>
</html>
